name: Build all Power Pause editions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install JDK 21 for API 36 Robolectric
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Remember the test JDK
        run: echo "JAVA21_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - name: Install JDK 17 for Android compilation
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK 36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          chmod +x gradlew
      - name: Test, lint and build all editions
        run: >-
          ./gradlew
          :app:testSimpleDebugUnitTest :app:testCompatibilityDebugUnitTest :app:testAdvancedDebugUnitTest
          :app:lintSimpleRelease :app:lintCompatibilityRelease :app:lintAdvancedRelease
          :app:assembleSimpleDebug :app:assembleCompatibilityDebug :app:assembleAdvancedDebug
          "-Pspm.testJavaHome=$JAVA21_HOME"
          --no-daemon --max-workers=2 --console=plain
      - name: Upload test APKs and verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Power-Pause-CI-test-builds
          retention-days: 14
          path: |
            app/build/outputs/apk/simple/debug/*.apk
            app/build/outputs/apk/advanced/debug/*.apk
            app/build/outputs/apk/compatibility/debug/*.apk
            app/build/reports/
            app/build/test-results/
