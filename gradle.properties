org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# The Kotlin compile daemon needs to write a timestamp marker under
# %LOCALAPPDATA%\kotlin\daemon, which is outside this workspace and is not writable here
# (observed: java.nio.file.AccessDeniedException on kotlin-daemon-client-*.tmp). Gradle then
# falls back to in-process compilation anyway, so this pins the working strategy and removes
# the noisy retry. It does not change what is compiled.
kotlin.compiler.execution.strategy=in-process

# AGP's Unified Test Platform keeps scratch state outside the project directory, which fails
# in restricted environments. The legacy instrumentation runner writes results under
# app/build instead and reports the same JUnit XML.
android.experimental.androidTest.useUnifiedTestPlatform=false

# spm.appId: overrides the applicationId (default: com.example.shutdownprotection).
# DEBUG_KEYSTORE_PATH: optional env override for the debug signing keystore.
# AGP defaults to ~/.android/debug.keystore, which is not writable in every
# environment. Point it somewhere writable, e.g.:
#   $env:DEBUG_KEYSTORE_PATH='E:\Deepseek\Projects\Scheduled-Power-Menu-Restriction\_working\debug.keystore'
# (A standard `android`/`androiddebugkey` debug keystore can live there.)
# The Kotlin namespace (com.example.shutdownprotection) stays stable; only the
# built applicationId changes. Usage:
#   .\gradlew.bat :app:assembleDebug -Pspm.appId=com.example.spstest
# To make it permanent for this checkout, uncomment the next line:
# spm.appId=com.example.shutdownprotection
